<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="css/style.css" />

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />
</head>

<body>
    <div class="container">
        <header>
            <h1>
                <i class="fa-solid fa-cloud-sun"></i>
                Weather Dashboard
            </h1>

            <div class="search-box">
                <input type="text" id="locationInput" placeholder="Enter City..." />

                <button id="searchBtn">Search</button>

                <button id="refreshBtn">Refresh</button>
            </div>
        </header>

        <div id="loader" class="loader hidden"></div>

        <section class="weather-card">
            <div class="main-weather">
                <h2 id="cityName">Loading...</h2>

                <h1 id="temperature">--</h1>

                <p id="condition">--</p>
            </div>

            <div class="weather-details">
                <div class="detail-card">
                    <i class="fa-solid fa-wind"></i>
                    <span id="wind"></span>
                </div>

                <div class="detail-card">
                    <i class="fa-solid fa-cloud-rain"></i>
                    <span id="rain"></span>
                </div>
            </div>
        </section>

        <section>
            <h2 class="timeline-title">Previous 24 Hours</h2>

            <div id="pastHours" class="timeline"></div>
        </section>

        <section>
            <h2 class="timeline-title">Next 24 Hours</h2>

            <div id="futureHours" class="timeline"></div>
        </section>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
